spring.application.name=codegap

spring.datasource.url=${CODEGAP_DB_URL:jdbc:h2:mem:codegap;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${CODEGAP_DB_USERNAME:sa}
spring.datasource.password=${CODEGAP_DB_PASSWORD:}
spring.datasource.driver-class-name=${CODEGAP_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

