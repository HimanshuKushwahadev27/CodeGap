spring.application.name=codegap

spring.kafka.bootstrap-servers=${CODEGAP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=${CODEGAP_KAFKA_LISTENER_AUTO_STARTUP:true}
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=codegap-sync-workers
spring.kafka.consumer.auto-offset-reset=earliest
codegap.kafka.sync-request-topic=sync-requests
codegap.kafka.sync-completed-topic=sync-completed
spring.datasource.generate-unique-name=false
spring.datasource.url=${CODEGAP_DB_URL:jdbc:h2:mem:codegap;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${CODEGAP_DB_USERNAME:sa}
spring.datasource.password=${CODEGAP_DB_PASSWORD:}
spring.datasource.driver-class-name=${CODEGAP_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
